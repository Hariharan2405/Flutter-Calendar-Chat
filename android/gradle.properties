org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
# No dependency in this project uses the legacy com.android.support library
# (uCrop 2.2.10 and every other artifact are AndroidX-native), so Jetifier had
# nothing to rewrite — it was only transforming every jar, including the large
# Flutter embedding ones, which exhausted the heap on lower-memory machines.
android.enableJetifier=false
